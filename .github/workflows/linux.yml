name: Linux port

on:
  push:
    branches: [linux]
    tags: ['linux-v*']
  pull_request:
    branches: [linux]
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft release from this Linux tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  launchers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check shell syntax and firmware launcher scenarios
        run: |
          bash -n packaging/linux/PKForge.sh
          sh -n packaging/linux/launch.sh
          sh -n packaging/linux/nextui-launch.sh
          python3 tools/linux/test-launchers.py
          python3 tools/linux/parity-inventory.py
  linux:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test Linux solution
        run: dotnet test PKForge.Linux.slnx -c Release --logger "trx;LogFilePrefix=linux"
      - name: Test release identity and provenance guards
        shell: pwsh
        run: ./tools/linux/test-release.ps1
      - name: Build binary and complete source packages
        shell: pwsh
        run: ./tools/linux/build.ps1
      - name: Verify release package
        shell: pwsh
        run: ./tools/linux/verify-package.ps1 -ExpectedCommit '${{ github.sha }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkforge-linux-release
          path: |
            dist/*-arm64.zip
            dist/*-full-source.zip
            dist/SHA256SUMS.txt
            dist/BUILDINFO.json
          retention-days: 14
          if-no-files-found: error

  source-rebuild:
    needs: [linux]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Rebuild complete source outside Git and check tamper refusal
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download $env:GITHUB_RUN_ID -n pkforge-linux-release -D release-input
          if ($LASTEXITCODE) { throw 'Could not download the verified release input.' }
          $info = Get-Content release-input/BUILDINFO.json -Raw | ConvertFrom-Json
          $source = Join-Path $env:RUNNER_TEMP 'pkforge-complete-source'
          $archive = Join-Path (Resolve-Path release-input) "PKForge-v3.1.1-linux-$($info.linux)-full-source.zip"
          [IO.Compression.ZipFile]::ExtractToDirectory($archive, $source)
          Push-Location $source
          try {
            dotnet test PKForge.Linux.slnx -c Release --nologo
            if ($LASTEXITCODE) { throw 'Complete-source tests failed.' }
            ./tools/linux/build.ps1
            ./tools/linux/verify-package.ps1 -ExpectedCommit '${{ github.sha }}'
            Add-Content Directory.Build.props '<!-- manifest tamper check -->'
            . ./tools/linux/source.ps1
            $rejected = $false
            try { Read-SourceProvenance $source } catch { $rejected = $true }
            if (-not $rejected) { throw 'Changed complete source was accepted.' }
          } finally { Pop-Location }

  android-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android workload
        run: dotnet workload install maui-android
      - name: Compile Android without upstream release signing
        run: dotnet build src/PKForge.App/PKForge.App.csproj -c Debug -p:AndroidKeyStore=false

  draft-release:
    if: github.repository == 'DankMiimer/PKForge-ARM-LINUX' && github.event_name == 'workflow_dispatch' && inputs.create_draft && startsWith(github.ref, 'refs/tags/linux-v')
    needs: [linux, source-rebuild, android-compatibility, launchers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create draft with verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh run download "$RUN_ID" -n pkforge-linux-release -D dist
          cd dist
          sha256sum -c SHA256SUMS.txt
          test "$RELEASE_TAG" = "linux-v$(jq -r .linux BUILDINFO.json)"
          jq -e --arg commit "$RELEASE_COMMIT" '.dirty == false and .candidate == false and .portCommit == $commit' BUILDINFO.json
          revision=$(jq -r .linux BUILDINFO.json)
          title="PKForge 3.1.1 — Linux port $revision"
          flags=()
          case $(jq -r .channel BUILDINFO.json) in
            stable)
              [[ "$revision" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
              python3 ../tools/linux/parity-inventory.py --require-complete ;;
            preview) [[ "$revision" == *-* ]]; flags+=(--prerelease); title+=" Preview" ;;
            *) echo 'Candidate/unknown channels cannot be released.' >&2; exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" --verify-tag --draft "${flags[@]}" \
            --title "$title" \
            --notes-file ../RELEASE_NOTES.md \
            *-arm64.zip *-full-source.zip SHA256SUMS.txt BUILDINFO.json
