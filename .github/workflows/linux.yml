name: Linux port

on:
  push:
    branches: [linux]
    tags: ['linux-v*']
  pull_request:
    branches: [linux]
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft prerelease from this Linux tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test Linux solution
        run: dotnet test PKForge.Linux.slnx -c Release --logger "trx;LogFilePrefix=linux"
      - name: Build binary and complete source packages
        shell: pwsh
        run: ./tools/linux/build.ps1
      - name: Verify release package
        shell: pwsh
        run: ./tools/linux/verify-package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkforge-linux-release
          path: |
            dist/*-arm64.zip
            dist/*-full-source.zip
            dist/SHA256SUMS.txt
            dist/BUILDINFO.json
          retention-days: 14
          if-no-files-found: error

  android-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android workload
        run: dotnet workload install maui-android
      - name: Compile Android without upstream release signing
        run: dotnet build src/PKForge.App/PKForge.App.csproj -c Debug -p:AndroidKeyStore=false

  draft-release:
    if: github.repository == 'DankMiimer/PKForge-ARM-LINUX' && github.event_name == 'workflow_dispatch' && inputs.create_draft && startsWith(github.ref, 'refs/tags/linux-v')
    needs: [linux, android-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create draft with verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" -n pkforge-linux-release -D dist
          cd dist
          sha256sum -c SHA256SUMS.txt
          test "$RELEASE_TAG" = "linux-v$(jq -r .linux BUILDINFO.json)"
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
            --title "PKForge 3.1.1 — Linux port $(jq -r .linux BUILDINFO.json) Preview" \
            --notes-file ../RELEASE_NOTES.md \
            *-arm64.zip *-full-source.zip SHA256SUMS.txt BUILDINFO.json
